<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title
        id="pageTitle"
        data-ar="تفاصيل الجهاز"
        data-en="Device Details">
        تفاصيل الجهاز
    </title>


    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {

                    colors: {
                        'ts-black': '#0a0a0c',
                        'ts-beige': '#f5f2eb',
                        'ts-blue': '#1e3a8a',
                        'ts-light-blue': '#4A70A9',
                    },

                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }

                }
            }
        }
    </script>


    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">


    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body
    class="bg-ts-black text-ts-beige font-cairo min-h-screen flex flex-col"
>


    <!-- ===================== HEADER ===================== -->

    <header class="py-6 px-6 max-w-6xl mx-auto w-full">

        <a
            href="products.html"
            class="inline-flex items-center gap-2 text-ts-light-blue text-sm font-semibold hover:underline"
        >

            <svg
                class="w-4 h-4 rotate-180"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 19l-7-7 7-7"
                />
            </svg>

            <span
                data-ar="العودة إلى المنتجات"
                data-en="Back to Products">
                العودة إلى المنتجات
            </span>

        </a>

    </header>


    <!-- ===================== MAIN ===================== -->

    <main
        class="flex-grow max-w-6xl mx-auto px-6 py-8 w-full"
    >

        <div
            class="grid lg:grid-cols-2 gap-12 items-start"
        >


            <!-- ===================== PRODUCT IMAGE ===================== -->

            <div
                class="relative rounded-3xl overflow-hidden border border-ts-beige/20 shadow-2xl h-80 lg:h-[450px]"
            >

                <img
                    id="productImage"
                    src=""
                    alt="Product Image"
                    class="w-full h-full object-cover"
                >

                <span
                    id="productBadge"
                    class="absolute top-4 right-4 px-4 py-1.5 rounded-full bg-ts-blue/80 text-ts-beige text-xs font-semibold"
                ></span>

            </div>


            <!-- ===================== PRODUCT INFORMATION ===================== -->

            <div class="flex flex-col">


                <!-- Product Title -->

                <h1
                    id="productTitle"
                    class="text-3xl lg:text-4xl font-bold mb-4 text-ts-light-blue"
                ></h1>


                <!-- Description -->

                <p
                    id="productDesc"
                    class="text-ts-beige/70 text-base leading-relaxed mb-8"
                ></p>


                <!-- Specifications Title -->

                <h3
                    class="text-xl font-bold mb-4 pb-2 border-b border-ts-beige/20"
                    data-ar="المواصفات التقنية"
                    data-en="Technical Specifications">
                    المواصفات التقنية
                </h3>


                <!-- Specifications -->

                <div
                    id="specsContainer"
                    class="space-y-3 mb-8"
                ></div>


            </div>

        </div>

    </main>


    <!-- ===================== JAVASCRIPT ===================== -->

    <script src="../js/product-details.js"></script>

    <script src="../js/script.js"></script>


</body>

</html>
